home:
  alias: '/left'

pages:
  theme: resume-nordic
  process:
    markdown: true
    twig: false
  markdown:
    extra: true

# -------------------------------------------------------------------
# OPTIONAL: MULTI-LANGUAGE SUPPORT
# To enable multi-language (e.g., English & French), uncomment the block below.
# Then create content files like: experience.en.md and experience.fr.md
# -------------------------------------------------------------------
# languages:
#   supported:
#     - en
#     - fr
#   default_lang: en
#   include_default_lang: false
#   translations: true
#   http_accept_language: true
#   session_store_active: true
# -------------------------------------------------------------------

cache:
  enabled: true 
  check:
    method: file
  driver: auto
  prefix: 'g'

twig:
  cache: true
  debug: true
  auto_reload: true
  autoescape: false

assets:
  css_pipeline: false
  css_minify: true
  css_rewrite: true
  js_pipeline: false
  js_minify: true

debugger:
  enabled: false
  twig: true
  shutdown:
    close_connection: true
