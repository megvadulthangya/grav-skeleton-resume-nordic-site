name: Build Skeleton Package (Clean)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (pl. v1.0.0)'
        required: true
        default: 'v1.0.0'
      version:
        description: 'Which Grav release to use (pl. latest vagy 1.7.46)'
        required: true
        default: 'latest'
      admin:
        description: 'Create also a package with Admin?'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Kód letöltése
    - name: Checkout Skeleton Code
      uses: actions/checkout@v4

    # 2. PHP 8.3 (A szabvány)
    # Ez a modern, gyors, hivatalos út.
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3' 
        extensions: mbstring, intl, gd, xml, zip

    # 3. Grav Core letöltése (DINAMIKUS!)
    # Azt a verziót szedi le, amit a szövegdobozba írsz.
    - name: Download Grav Core
      run: |
        echo "⬇️ Downloading Grav version: ${{ inputs.version }}..."
        wget -q -O grav.zip https://getgrav.org/download/core/grav/${{ inputs.version }}
        unzip -q grav.zip
        mv grav webroot
        rm grav.zip

    # 4. A Te fájljaid bemásolása
    - name: Overlay Skeleton Files
      run: |
        echo "📂 Copying skeleton files into Grav..."
        for dir in pages themes plugins config assets data accounts; do
          if [ -d "$dir" ]; then
            cp -r "$dir" webroot/user/
          fi
        done
        if [ -f ".dependencies" ]; then
            cp .dependencies webroot/
        fi

    # 5. Nord Téma telepítése
    - name: Install Nord Theme
      run: |
        echo "🎨 Cloning Nord Resume Theme..."
        git clone -b develop https://github.com/megvadulthangya/grav-theme-resume-nordic webroot/user/themes/resume-nordic
        rm -rf webroot/user/themes/resume-nordic/.git

    # 6. Pluginok telepítése
    - name: Install Standard Plugins
      run: |
        cd webroot
        bin/gpm install error problems -f -y

    # 7. Takarítás
    - name: Cleanup
      run: |
        cd webroot
        echo "🧹 Cleaning up..."
        rm -rf cache/* logs/* tmp/* .git .github
        find . -name ".git" -type d -exec rm -rf {} +
        
        # A Quark témát kiszedjük, hogy tiszta legyen a csomag
        rm -rf user/themes/quark

    # -----------------------------------------------------------
    # CSOMAG 1: STANDARD (Admin nélkül)
    # Mindig elkészül.
    # -----------------------------------------------------------
    - name: Create Standard ZIP
      run: |
        cd webroot
        zip -r -q ../grav-skeleton-resume-nordic-site-${{ inputs.tag }}.zip .

    # -----------------------------------------------------------
    # CSOMAG 2: ADMINOS (Választható)
    # Csak akkor készül el, ha a checkbox be van pipálva.
    # -----------------------------------------------------------
    - name: Install Admin Plugin
      if: ${{ inputs.admin == true }}
      run: |
        cd webroot
        echo "➕ Installing Admin Panel..."
        bin/gpm install admin -f -y
        rm -rf cache/* logs/* tmp/*

    - name: Create Admin ZIP
      if: ${{ inputs.admin == true }}
      run: |
        cd webroot
        zip -r -q ../grav-skeleton-resume-nordic-site+admin-${{ inputs.tag }}.zip .

    # 8. Feltöltés (A csillag miatt feltölti mindkettőt, ha van)
    - name: Upload to Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ inputs.tag }}
        file: grav-skeleton-resume-nordic-site*.zip
        overwrite: true
        file_glob: true
