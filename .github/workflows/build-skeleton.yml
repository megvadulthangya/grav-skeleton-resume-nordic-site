name: Build Skeleton Package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (pl. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Kód letöltése
    - name: Checkout Skeleton Code
      uses: actions/checkout@v4

    # 2. PHP 8.3 beállítása
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, intl, gd, xml, zip

    # 3. Grav Admin letöltése
    - name: Download & Install Grav
      run: |
        echo "⬇️ Downloading latest Grav + Admin..."
        wget -q -O grav-admin.zip https://getgrav.org/download/core/grav-admin/latest
        unzip -q grav-admin.zip
        mv grav-admin webroot
        rm grav-admin.zip

    # 4. Skeleton fájlok másolása
    - name: Overlay Skeleton Files
      run: |
        echo "📂 Copying skeleton files into Grav..."
        # Mappák másolása
        for dir in pages themes plugins config assets data accounts; do
          if [ -d "$dir" ]; then
            cp -r "$dir" webroot/user/
          fi
        done
        # .dependencies másolása
        if [ -f ".dependencies" ]; then
            cp .dependencies webroot/
        fi

    # 5. Téma MANUÁLIS telepítése (Git Clone)
    - name: Install Nord Theme Manually
      run: |
        echo "🎨 Cloning Nord Resume Theme from GitHub..."
        # Direktben a GitHubról húzzuk le a helyére (develop ág)
        git clone -b develop https://github.com/megvadulthangya/grav-theme-resume-nordic webroot/user/themes/resume-nordic
        # Töröljük a .git mappát, hogy tiszta legyen
        rm -rf webroot/user/themes/resume-nordic/.git

    # 6. Hivatalos pluginok telepítése GPM-mel (KONKRÉT NEVEKKEL!)
    - name: Install Standard Plugins
      run: |
        cd webroot
        echo "📦 Installing standard plugins (Error, Problems)..."
        # Itt javítottuk a hibát: megadjuk a neveket!
        bin/gpm install error problems -f -y

    # 7. Takarítás
    - name: Cleanup
      run: |
        cd webroot
        rm -rf cache/* logs/* tmp/* .git .github
        find . -name ".git" -type d -exec rm -rf {} +

    # 8. Csomagolás
    - name: Create ZIP Package
      run: |
        zip -r grav-skeleton-resume-nordic-site-${{ inputs.tag }}.zip webroot

    # 9. Feltöltés
    - name: Upload to Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ inputs.tag }}
        file: grav-skeleton-resume-nordic-site-${{ inputs.tag }}.zip
        overwrite: true
