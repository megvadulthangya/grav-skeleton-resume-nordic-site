name: Build Skeleton Package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (pl. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Kód letöltése
    - name: Checkout Skeleton Code
      uses: actions/checkout@v4

    # 2. Modern PHP 8.3 (Gyors és stabil építéshez)
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3' 
        extensions: mbstring, intl, gd, xml, zip

    # 3. Grav letöltése (Ugyanaz, mint az entrypoint.sh-ban)
    - name: Download Grav Core
      run: |
        wget -q -O grav.zip https://getgrav.org/download/core/grav/latest
        unzip -q grav.zip
        mv grav webroot
        rm grav.zip

    # 4. Skeleton fájlok másolása (Mint a cp -Rf user a scriptben)
    - name: Overlay Skeleton Files
      run: |
        for dir in pages themes plugins config assets data accounts; do
          if [ -d "$dir" ]; then
            cp -r "$dir" webroot/user/
          fi
        done
        if [ -f ".dependencies" ]; then
            cp .dependencies webroot/
        fi

    # 5. Téma telepítése
    - name: Install Nord Theme Manually
      run: |
        git clone -b develop https://github.com/megvadulthangya/grav-theme-resume-nordic webroot/user/themes/resume-nordic
        rm -rf webroot/user/themes/resume-nordic/.git

    # 6. Pluginok telepítése
    - name: Install Standard Plugins
      run: |
        cd webroot
        bin/gpm install error problems -f -y

    # 7. Takarítás (Mint a script végén)
    - name: Cleanup
      run: |
        cd webroot
        rm -rf cache/* logs/* tmp/* .git .github
        find . -name ".git" -type d -exec rm -rf {} +
        rm -rf user/themes/quark

    # -----------------------------------------------------------
    # 💥 A NAGY TRÜKK - CSOMAG 1 ELŐTT 💥
    # -----------------------------------------------------------
    - name: NUKE Platform Check (Standard)
      run: |
        cd webroot
        echo "☢️ Felülírjuk az ellenőrző fájlt..."
        # Ez a parancs kiüríti a fájlt. Ha üres, nincs hibaüzenet!
        echo "<?php return;" > vendor/composer/platform_check.php

    - name: Create Standard ZIP
      run: |
        cd webroot
        zip -r -q ../grav-skeleton-resume-nordic-site-${{ inputs.tag }}.zip .

    # -----------------------------------------------------------
    # ADMIN TELEPÍTÉSE
    # -----------------------------------------------------------
    - name: Install Admin Plugin
      run: |
        cd webroot
        bin/gpm install admin -f -y
        rm -rf cache/* logs/* tmp/*

    # -----------------------------------------------------------
    # 💥 A NAGY TRÜKK - CSOMAG 2 ELŐTT (ÚJRA!) 💥
    # -----------------------------------------------------------
    # Azért kell újra, mert a 'bin/gpm install admin' visszarakhatta a rossz fájlt!
    - name: NUKE Platform Check (Admin)
      run: |
        cd webroot
        echo "☢️ Felülírjuk az ellenőrző fájlt ÚJRA..."
        echo "<?php return;" > vendor/composer/platform_check.php

    - name: Create Admin ZIP
      run: |
        cd webroot
        zip -r -q ../grav-skeleton-resume-nordic-site+admin-${{ inputs.tag }}.zip .

    # Feltöltés
    - name: Upload to Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ inputs.tag }}
        file: grav-skeleton-resume-nordic-site*.zip
        overwrite: true
        file_glob: true
