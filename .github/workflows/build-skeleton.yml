name: Build Skeleton Package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (pl. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Kód letöltése
    - name: Checkout Skeleton Code
      uses: actions/checkout@v4

    # 2. PHP 8.3 beállítása
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, intl, gd, xml, zip

    # 3. Grav Core (Admin NÉLKÜL) letöltése
    - name: Download Grav Core
      run: |
        echo "⬇️ Downloading Grav Core (No Admin)..."
        # Itt a sima 'grav' csomagot szedjük, nem a grav-admin-t
        wget -q -O grav.zip https://getgrav.org/download/core/grav/latest
        unzip -q grav.zip
        mv grav webroot
        rm grav.zip

    # 4. Skeleton fájlok másolása
    - name: Overlay Skeleton Files
      run: |
        echo "📂 Copying skeleton files into Grav..."
        for dir in pages themes plugins config assets data accounts; do
          if [ -d "$dir" ]; then
            cp -r "$dir" webroot/user/
          fi
        done
        if [ -f ".dependencies" ]; then
            cp .dependencies webroot/
        fi

    # 5. Téma MANUÁLIS telepítése (Git Clone)
    - name: Install Nord Theme Manually
      run: |
        echo "🎨 Cloning Nord Resume Theme..."
        git clone -b develop https://github.com/megvadulthangya/grav-theme-resume-nordic webroot/user/themes/resume-nordic
        rm -rf webroot/user/themes/resume-nordic/.git

    # 6. Alap pluginok telepítése (Error, Problems)
    - name: Install Standard Plugins
      run: |
        cd webroot
        bin/gpm install error problems -f -y

    # 7. Takarítás (Előkészület az első ZIP-hez)
    - name: Cleanup
      run: |
        cd webroot
        rm -rf cache/* logs/* tmp/* .git .github
        find . -name ".git" -type d -exec rm -rf {} +

    # ---------------------------------------------------------
    # 8. CSOMAG 1: SIMA VERZIÓ (Admin nélkül)
    # ---------------------------------------------------------
    - name: Create Standard ZIP
      run: |
        # Ez lesz a sima grav-skeleton-resume-nordic-site-v1.0.0.zip
        zip -r grav-skeleton-resume-nordic-site-${{ inputs.tag }}.zip webroot

    # ---------------------------------------------------------
    # 9. ADMIN TELEPÍTÉSE (Rárakjuk a meglévőre)
    # ---------------------------------------------------------
    - name: Install Admin Plugin
      run: |
        cd webroot
        echo "➕ Installing Admin Panel..."
        bin/gpm install admin -f -y
        # Újra kitakarítjuk a cache-t, amit a telepítés csinált
        rm -rf cache/* logs/* tmp/*

    # ---------------------------------------------------------
    # 10. CSOMAG 2: ADMINOS VERZIÓ
    # ---------------------------------------------------------
    - name: Create Admin ZIP
      run: |
        # Ez lesz a grav-skeleton-resume-nordic-site+admin-v1.0.0.zip
        zip -r grav-skeleton-resume-nordic-site+admin-${{ inputs.tag }}.zip webroot

    # 11. Mindkettő feltöltése
    - name: Upload to Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ inputs.tag }}
        # A csillag (*) miatt mindkét zip fájlt feltölti!
        file: grav-skeleton-resume-nordic-site*.zip
        overwrite: true
        file_glob: true
