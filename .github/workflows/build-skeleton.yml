name: Build Skeleton Package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (pl. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Skeleton Code
      uses: actions/checkout@v4

    # 1. PHP 8.1-et állítunk be! 
    # Ez a kulcs. Így a csomagolás 8.1-es kompatibilitással készül.
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: mbstring, intl, gd, xml, zip

    - name: Download Grav Core
      run: |
        echo "⬇️ Downloading Grav Core..."
        wget -q -O grav.zip https://getgrav.org/download/core/grav/latest
        unzip -q grav.zip
        mv grav webroot
        rm grav.zip

    # 2. A "VARÁZSLAT" 🪄
    # Mivel most PHP 8.1-ben vagyunk, utasítjuk a Composert, 
    # hogy generálja újra az ellenőrző fájlt a JELENLEGI (8.1) verzióhoz.
    # Így a 'platform_check.php' átíródik 8.3-ról 8.1-re!
    - name: Downgrade Requirement to PHP 8.1
      run: |
        cd webroot
        echo "📉 Regenerating platform requirements for PHP 8.1..."
        composer dump-autoload --optimize

    - name: Overlay Skeleton Files
      run: |
        echo "📂 Copying skeleton files into Grav..."
        for dir in pages themes plugins config assets data accounts; do
          if [ -d "$dir" ]; then
            cp -r "$dir" webroot/user/
          fi
        done
        if [ -f ".dependencies" ]; then
            cp .dependencies webroot/
        fi

    - name: Install Nord Theme Manually
      run: |
        echo "🎨 Cloning Nord Resume Theme..."
        git clone -b develop https://github.com/megvadulthangya/grav-theme-resume-nordic webroot/user/themes/resume-nordic
        rm -rf webroot/user/themes/resume-nordic/.git

    - name: Install Standard Plugins
      run: |
        cd webroot
        # Most már a GPM is menni fog, mert a requirement 8.1 lett!
        bin/gpm install error problems -f -y

    - name: Cleanup
      run: |
        cd webroot
        echo "🧹 Cleaning up..."
        rm -rf cache/* logs/* tmp/* .git .github
        find . -name ".git" -type d -exec rm -rf {} +
        rm -rf user/themes/quark

    # Csomag 1: Sima
    - name: Create Standard ZIP
      run: |
        cd webroot
        zip -r -q ../grav-skeleton-resume-nordic-site-${{ inputs.tag }}.zip .

    # Admin telepítése
    - name: Install Admin Plugin
      run: |
        cd webroot
        echo "➕ Installing Admin Panel..."
        bin/gpm install admin -f -y
        rm -rf cache/* logs/* tmp/*
        # Admin telepítés után is újra regeneráljuk a biztonság kedvéért!
        composer dump-autoload --optimize

    # Csomag 2: Adminos
    - name: Create Admin ZIP
      run: |
        cd webroot
        zip -r -q ../grav-skeleton-resume-nordic-site+admin-${{ inputs.tag }}.zip .

    - name: Upload to Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ inputs.tag }}
        file: grav-skeleton-resume-nordic-site*.zip
        overwrite: true
        file_glob: true
